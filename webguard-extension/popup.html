<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGuard</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        :root {
            --bg:      #090d14;
            --surface: #0e1520;
            --border:  #1e2d42;
            --accent:  #00e5ff;
            --danger:  #ff3b5c;
            --safe:    #00e87a;
            --warn:    #ffb020;
            --text:    #c9d8ee;
            --muted:   #5a7090;
            --mono:    'Space Mono', monospace;
            --sans:    'DM Sans', sans-serif;
        }

        body {
            width: 360px;
            min-height: 200px;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 13px;
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #00e5ff, #7c3aed);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; flex-shrink: 0;
        }
        .header-text { flex: 1; }
        .header-title {
            font-family: var(--mono);
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }
        .header-sub {
            font-size: 10px;
            font-family: var(--mono);
            color: var(--muted);
            letter-spacing: 1px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
        }
        .status-dot.online  { background: var(--safe); box-shadow: 0 0 6px var(--safe); animation: pulse 2s infinite; }
        .status-dot.offline { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── VERDICT CARD ── */
        .verdict-card {
            margin: 12px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid;
        }
        .verdict-card.vuln { border-color: rgba(255,59,92,.4);  background: rgba(255,59,92,.06); }
        .verdict-card.safe { border-color: rgba(0,232,122,.3);  background: rgba(0,232,122,.05); }
        .verdict-card.idle { border-color: var(--border);       background: var(--surface); }
        .verdict-card.warn { border-color: rgba(255,176,32,.4); background: rgba(255,176,32,.05); }

        .verdict-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .verdict-badge {
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1px;
        }
        .verdict-badge.vuln { background: var(--danger); color: #fff; }
        .verdict-badge.safe { background: var(--safe);   color: #000; }
        .verdict-badge.idle { background: var(--border); color: var(--muted); }
        .verdict-badge.warn { background: var(--warn);   color: #000; }

        .conf-wrap { flex: 1; }
        .conf-label { font-size: 10px; font-family: var(--mono); color: var(--muted); margin-bottom: 3px; }
        .conf-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .conf-fill  { height: 100%; border-radius: 3px; transition: width .5s; }
        .conf-fill.vuln { background: linear-gradient(90deg, var(--danger), #ff6b6b); }
        .conf-fill.safe { background: linear-gradient(90deg, var(--safe), #00ff99); }
        .conf-fill.warn { background: var(--warn); }
        .conf-pct { font-family: var(--mono); font-size: 11px; font-weight: 700; color: #fff; }

        .verdict-body { padding: 10px 14px; }

        .source-row {
            font-size: 11px;
            color: var(--muted);
            font-family: var(--mono);
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── PATTERNS ── */
        .patterns-wrap { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .pattern-chip {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(255,176,32,.1);
            border: 1px solid rgba(255,176,32,.25);
            border-radius: 4px;
            padding: 3px 8px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--warn);
        }
        .sev {
            font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 700;
        }
        .sev-CRITICAL, .sev-HIGH   { background: var(--danger); color: #fff; }
        .sev-MEDIUM                { background: var(--warn);   color: #000; }
        .sev-LOW                   { background: var(--muted);  color: #fff; }

        /* ── AI EXPLANATION ── */
        .ai-section {
            margin: 0 12px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .ai-head {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            background: rgba(124,58,237,.08);
        }
        .ai-head-title {
            font-family: var(--mono); font-size: 10px;
            letter-spacing: 1px; text-transform: uppercase;
            color: #a78bfa;
        }
        .ai-loading {
            padding: 16px; text-align: center;
            font-family: var(--mono); font-size: 10px; color: var(--muted);
        }
        .ai-ring {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: #a78bfa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ai-body { padding: 10px 12px; }
        .ai-label {
            font-family: var(--mono); font-size: 9px;
            letter-spacing: 1px; text-transform: uppercase;
            color: var(--muted); margin-bottom: 4px; margin-top: 8px;
        }
        .ai-label:first-child { margin-top: 0; }
        .ai-value { font-size: 11px; color: var(--text); line-height: 1.6; }
        .ai-value.danger { color: var(--danger); }
        .ai-value.warn   { color: var(--warn); }

        .prev-list { list-style: none; margin-top: 4px; }
        .prev-list li {
            display: flex; gap: 6px;
            font-size: 11px; color: var(--text);
            line-height: 1.5; margin-bottom: 5px;
            padding: 5px 8px;
            background: rgba(0,229,255,.04);
            border: 1px solid rgba(0,229,255,.1);
            border-radius: 5px;
        }
        .prev-num {
            font-family: var(--mono); font-size: 9px;
            color: var(--accent); font-weight: 700; min-width: 14px; margin-top: 1px;
        }

        /* ── INPUT PREVIEW ── */
        .input-preview {
            margin: 0 12px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: var(--mono);
            font-size: 10px;
            color: var(--muted);
            word-break: break-all;
            max-height: 54px;
            overflow: hidden;
            position: relative;
        }
        .input-preview::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 20px;
            background: linear-gradient(transparent, var(--surface));
        }

        /* ── FOOTER ACTIONS ── */
        .footer {
            display: flex; gap: 8px;
            padding: 10px 12px;
            border-top: 1px solid var(--border);
        }
        .btn {
            flex: 1; padding: 8px;
            border: none; border-radius: 6px;
            font-family: var(--mono); font-size: 10px;
            font-weight: 700; letter-spacing: .5px;
            cursor: pointer; transition: opacity .15s;
        }
        .btn:hover { opacity: .85; }
        .btn-primary { background: linear-gradient(135deg, var(--accent), #0088bb); color: #000; }
        .btn-ghost   { background: var(--surface); border: 1px solid var(--border); color: var(--muted); }

        /* ── IDLE STATE ── */
        .idle-msg {
            padding: 30px 20px; text-align: center; color: var(--muted);
        }
        .idle-icon { font-size: 28px; opacity: .3; margin-bottom: 10px; }
        .idle-text { font-family: var(--mono); font-size: 10px; letter-spacing: 1px; line-height: 1.8; }

        /* ── OFFLINE STATE ── */
        .offline-msg {
            margin: 12px;
            background: rgba(255,59,92,.07);
            border: 1px solid rgba(255,59,92,.2);
            border-radius: 8px;
            padding: 14px;
            text-align: center;
        }
        .offline-msg p { font-family: var(--mono); font-size: 10px; color: var(--danger); line-height: 1.8; }
        .offline-msg small { color: var(--muted); font-size: 10px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">🛡</div>
        <div class="header-text">
            <div class="header-title">WebGuard</div>
            <div class="header-sub">WEB VULNERABILITY MONITOR</div>
        </div>
        <div class="status-dot" id="statusDot"></div>
    </div>

    <!-- SCOPE / CONSENT NOTICE -->
    <div style="padding:8px 16px;background:rgba(0,229,255,.05);border-bottom:1px solid var(--border);font-size:10px;line-height:1.5;color:var(--muted);font-family:var(--sans);">
        WebGuard only <strong style="color:var(--text);">reads pages you visit, locally</strong>. It never sends test traffic to any site. Active testing runs only in the app, only against targets you explicitly authorize.
    </div>

    <!-- MAIN CONTENT -->
    <div id="mainContent">
        <div class="idle-msg">
            <div class="idle-icon">🔍</div>
            <div class="idle-text">Loading last scan result…</div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer" style="flex-wrap:wrap;gap:6px;">
        <button class="btn btn-primary" id="guidedScanBtn" style="background:linear-gradient(135deg,#ff3b5c,#c0002a);color:#fff;">🧭 Open Guided Scan</button>
        <button class="btn btn-primary" id="dashboardBtn">Dashboard</button>
        <button class="btn btn-ghost"   id="clearBtn">Clear</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
